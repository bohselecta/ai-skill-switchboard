name: Refresh v1.1 installable bundles

on:
  push:
    branches: [feat/tasks-move-skill-chat]
    paths:
      - .github/workflows/refresh-v1.1-bundles.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tasks-move-skill-chat
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh reproducible edition bundles
        run: npm run package
      - name: Commit only generated ZIPs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt/skill-switchboard-chatgpt.zip claude/skill-switchboard-claude.zip gemini/skill-switchboard-gemini.zip
          if git diff --cached --quiet; then
            echo "Bundles already current."
          else
            git commit -m "Refresh v1.1 installable skill bundles"
            git push origin HEAD:feat/tasks-move-skill-chat
          fi
