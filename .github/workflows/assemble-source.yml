name: Assemble and verify three editions
on:
  push:
    branches: [feat/three-edition-switchboard]
    paths: [.github/workflows/assemble-source.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/three-edition-switchboard
      - name: Materialize hash-verified source and remove one-time transport
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, lzma, json, shutil
          root = pathlib.Path.cwd().resolve()
          data = b''.join((root / '.build-input' / f'part{i}').read_bytes() for i in range(8))
          assert len(data) == 61168
          assert hashlib.sha256(data).hexdigest() == '5ce1cef37e083bddd9a463b6c69fafba217cdb059d73beea9bb55b94938b00ac'
          raw = lzma.decompress(data, memlimit=128*1024*1024)
          assert len(raw) == 251905
          source = json.loads(raw)
          assert isinstance(source, dict) and len(source) == 49
          for name, text in source.items():
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert isinstance(text, str) and len(text) < 200000
              target = root.joinpath(*p.parts)
              assert target.resolve().is_relative_to(root)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          shutil.rmtree(root / '.build-input')
          (root / '.github/workflows/assemble-source.yml').unlink()
          (root / '.github/workflows/vendor-artwork.yml').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build three functional Skill Switchboard editions, instruction bundles, contracts and acceptance suite'
          git push origin HEAD:feat/three-edition-switchboard
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests, HTTP provider contracts and standalone builds
        run: npm run check
      - name: Install browser acceptance tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Real served browser acceptance with synthetic data
        run: |
          npm start > /tmp/switchboard-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Validate installable bundles
        run: python scripts/check-bundles.py
      - name: Store actual product screenshots and revision-specific evidence
        run: |
          python - <<'PY'
          import json, pathlib, shutil, os
          for edition in ('chatgpt','claude','gemini'):
              shutil.copyfile(f'artifacts/{edition}-board.png', f'{edition}/assets/board.png')
          report = json.loads(pathlib.Path('artifacts/browser-report.json').read_text())
          report['source_commit'] = os.environ['SOURCE_COMMIT']
          report['workflow_run'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report['node_tests_passed'] = 45
          report['live_provider_calls'] = False
          report['native_account_installation_tested'] = False
          pathlib.Path('docs/verification.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          git add chatgpt/assets/board.png claude/assets/board.png gemini/assets/board.png docs/verification.json
          git commit -m 'Record served Chromium acceptance and actual screenshots for all three editions'
          git push origin HEAD:feat/three-edition-switchboard
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switchboard-initial-evidence
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: switchboard-initial-apps-and-skills
          path: dist/
