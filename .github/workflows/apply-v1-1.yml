        run: npm run check
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Served browser acceptance
        run: |
          npm start > /tmp/switchboard-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Refresh actual interface captures and downloadable bundles
        run: |
          cp artifacts/chatgpt-board.png chatgpt/assets/board.png
          cp artifacts/claude-board.png claude/assets/board.png
          cp artifacts/gemini-board.png gemini/assets/board.png
          npm run package
          python scripts/check-bundles.py
      - name: Commit the v1.1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement task-to-skill journeys and portable skill contracts"
          git push origin HEAD:feat/task-to-skill-v1-1
