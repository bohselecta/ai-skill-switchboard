name: Apply task-to-skill v1.1
on:
  push:
    branches: [feat/task-to-skill-v1-1]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed v1.1 source patch
        shell: bash
        run: |
          cat .github/patches/v1-1-part-* > /tmp/update.patch.gz.b64
          echo "f4428ac59d560b6c775221dc6ab494d5e63048d3cfdd68419c3f2d4ac7d6cd6e  /tmp/update.patch.gz.b64" | sha256sum -c -
          tr -d '[:space:]' < /tmp/update.patch.gz.b64 | base64 -d | gzip -d > /tmp/update.patch
          echo "5b1c4d354a324f594bda92cf8ab4147456c8991619958d37f2962ca0a8f8a693  /tmp/update.patch" | sha256sum -c -
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/build.mjs")
          s = p.read_text()
          old = "JSON.stringify({version:'1.0.0',outputs}"
          new = "JSON.stringify({version:'1.1.0',outputs}"
          if old not in s:
              raise SystemExit("Expected build manifest version marker not found")
          p.write_text(s.replace(old, new))
          PY
      - name: Source and contract checks
        run: npm run check
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Served browser acceptance
        run: |
          npm start > /tmp/switchboard-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Refresh actual interface captures and downloadable bundles
        run: |
          cp artifacts/chatgpt-board.png chatgpt/assets/board.png
          cp artifacts/claude-board.png claude/assets/board.png
          cp artifacts/gemini-board.png gemini/assets/board.png
          npm run package
          python scripts/check-bundles.py
      - name: Commit the v1.1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement task-to-skill journeys and portable skill contracts"
          git push origin HEAD:feat/task-to-skill-v1-1
