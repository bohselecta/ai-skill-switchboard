name: Capture release evidence
on:
  push:
    branches: [feat/three-edition-switchboard]
    paths: [.github/workflows/capture-evidence.yml]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/three-edition-switchboard
      - name: Correct the test locator to the actual dialog return control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tests/browser.py')
          before = 'aac0bb9b1e4e7891db696c6cb21bfa04086c0947a7accfb740b1a72de8a16e01'
          after = '678eb2ae23b4c10036593f003dcedab94c02a63fc71014134ea2507dab1c73f9'
          current = hashlib.sha256(p.read_bytes()).hexdigest()
          if current != after:
              assert current == before, 'Unexpected concurrent test change'
              source = p.read_text()
              old = '''                if page.get_by_role('textbox',name='Text to copy').count():
                              assert len(page.get_by_role('textbox',name='Text to copy').input_value())>300
                              close(page);click(page,'view','inbox');page.get_by_role('button',name='Email reply for the new project',exact=False).click()
                          else:click(page,'task',page.locator('[data-action="task"]').filter(visible=True).first.get_attribute('data-id'))
          '''
              # Work line-by-line to preserve the source indentation exactly.
              lines = source.splitlines(keepends=True)
              target = next(i for i, line in enumerate(lines) if "if page.get_by_role('textbox',name='Text to copy').count():" in line)
              assert "else:click(page,'task',page.locator(" in lines[target + 3]
              lines[target + 2:target + 4] = ["                page.locator('#dialog').get_by_role('button',name='Back to task',exact=True).click()\n"]
              p.write_text(''.join(lines))
              assert hashlib.sha256(p.read_bytes()).hexdigest() == after
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser.py
          git diff --cached --quiet || git commit -m 'Use the modal Back to task control in the clipboard acceptance path'
          git push origin HEAD:feat/three-edition-switchboard
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests, provider HTTP contracts and builds
        run: npm run check
      - name: Install browser tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Served browser acceptance
        run: |
          npm start > /tmp/switchboard-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Verify bundles
        run: python scripts/check-bundles.py
      - name: Commit actual screenshots and acceptance evidence only after all checks pass
        run: |
          python - <<'PY'
          import json, pathlib, shutil, os
          report = json.loads(pathlib.Path('artifacts/browser-report.json').read_text())
          assert len(report['results']) == 22 and all(r['status'] == 'passed' for r in report['results'])
          for edition in ('chatgpt','claude','gemini'):
              shutil.copyfile(f'artifacts/{edition}-board.png', f'{edition}/assets/board.png')
          report['source_commit'] = os.environ['SOURCE_COMMIT']
          report['workflow_run'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report['node_tests_passed'] = 45
          report['native_account_installation_tested'] = False
          pathlib.Path('docs/verification.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          git add chatgpt/assets/board.png claude/assets/board.png gemini/assets/board.png docs/verification.json
          git commit -m 'Publish actual three-edition browser screenshots and passing acceptance evidence'
          git push origin HEAD:feat/three-edition-switchboard
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switchboard-release-evidence
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: switchboard-release-apps-and-skills
          path: dist/
