name: Capture release evidence
on:
  push:
    branches: [feat/three-edition-switchboard]
    paths: [.github/workflows/capture-evidence.yml]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/three-edition-switchboard
      - name: Wait for completed writes before asserting persistence and retain actionable failure evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tests/browser.py')
          before = 'a8c60ade5cc6d0502434609b7d2dda354dd9e59cd4ee9a5e0f6e452f07ec5d6c'
          after = 'b976aa6995ed0cef7ac8a5a2c3b4500eefb9b17e994fee616c5c688c19e6e06c'
          current = hashlib.sha256(p.read_bytes()).hexdigest()
          if current != after:
              assert current == before, 'Unexpected concurrent test change'
              source = p.read_text()
              changes = [
                  ("'error':str(e),'seconds'", "'error':f'{type(e).__name__}: {e}','traceback':traceback.format_exc(),'seconds'"),
                  ("f=page.locator('form[data-form=\"approve\"]');f.locator('input').check();f.get_by_role('button').click();close(page)", "f=page.locator('form[data-form=\"approve\"]');f.locator('input').check();f.get_by_role('button').click()\n                    expect(page.get_by_text('Approved here. Still not sent anywhere.',exact=False)).to_be_visible();close(page)"),
                  ("click(page,'import');page.locator('#file-input').set_input_files(str(backup));click(page,'confirm-restore')", "click(page,'import');page.locator('#file-input').set_input_files(str(backup));click(page,'confirm-restore')\n                    expect(page.locator('#toast')).to_contain_text('Backup restored.')"),
                  ("page.get_by_role('button',name='Explore a sample board').click()\n            record('storage:", "page.get_by_role('button',name='Explore a sample board').click()\n                expect(page.locator('.skill-tile')).to_have_count(6)\n            record('storage:"),
                  ("page.get_by_role('button',name='Capture & route').click()\n                other.get_by_role", "page.get_by_role('button',name='Capture & route').click()\n                expect(page.locator('#dialog-title')).to_have_text('Saved work in first tab')\n                other.get_by_role"),
                  ("f.get_by_role('button',name='Capture & route').click()\n                assert page.locator('#dialog img')", "f.get_by_role('button',name='Capture & route').click()\n                expect(page.locator('#dialog-title')).to_have_text('<img src=x onerror=alert(1)>')\n                assert page.locator('#dialog img')")
              ]
              for old, new in changes:
                  assert source.count(old) == 1
                  source = source.replace(old, new)
              p.write_text(source)
              assert hashlib.sha256(p.read_bytes()).hexdigest() == after
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser.py
          git diff --cached --quiet || git commit -m 'Synchronize persistence acceptance with actual completed saves and improve failure traces'
          git push origin HEAD:feat/three-edition-switchboard
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests, provider HTTP contracts and builds
        run: npm run check
      - name: Install browser tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Served browser acceptance
        run: |
          npm start > /tmp/switchboard-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Verify bundles
        run: python scripts/check-bundles.py
      - name: Commit actual screenshots and acceptance evidence only after all checks pass
        run: |
          python - <<'PY'
          import json, pathlib, shutil, os
          report = json.loads(pathlib.Path('artifacts/browser-report.json').read_text())
          assert len(report['results']) == 22 and all(r['status'] == 'passed' for r in report['results'])
          for edition in ('chatgpt','claude','gemini'):
              shutil.copyfile(f'artifacts/{edition}-board.png', f'{edition}/assets/board.png')
          report['source_commit'] = os.environ['SOURCE_COMMIT']
          report['workflow_run'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report['node_tests_passed'] = 45
          report['native_account_installation_tested'] = False
          pathlib.Path('docs/verification.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          git add chatgpt/assets/board.png claude/assets/board.png gemini/assets/board.png docs/verification.json
          git commit -m 'Publish actual three-edition browser screenshots and passing acceptance evidence'
          git push origin HEAD:feat/three-edition-switchboard
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switchboard-release-evidence
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: switchboard-release-apps-and-skills
          path: dist/
