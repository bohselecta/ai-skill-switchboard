name: Capture release evidence
on:
  push:
    branches: [feat/three-edition-switchboard]
    paths: [.github/workflows/capture-evidence.yml]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/three-edition-switchboard
      - name: Correct fault injection and prepare one-click downloadable editions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def patch(path, before, after, changes):
              p=Path(path)
              current=hashlib.sha256(p.read_bytes()).hexdigest()
              if current == after: return
              assert current == before, 'Unexpected concurrent source change'
              s=p.read_text()
              for old,new in changes:
                  assert s.count(old)==1
                  s=s.replace(old,new)
              p.write_text(s)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==after
          patch('tests/browser.py','b976aa6995ed0cef7ac8a5a2c3b4500eefb9b17e994fee616c5c688c19e6e06c','c5ad5f296317afe5906f4aabd10715ad1fb50665d9d9625473526cd8a7795161',[
              ('page.evaluate("window.originalSet=Storage.prototype.setItem;Storage.prototype.setItem=function(){throw new DOMException(\'quota\',\'QuotaExceededError\')}")','page.evaluate("() => { window.originalSet=Storage.prototype.setItem;Storage.prototype.setItem=function(){throw new DOMException(\'quota\',\'QuotaExceededError\')}; }")'),
              ('page.evaluate("Storage.prototype.setItem=window.originalSet")','page.evaluate("() => { Storage.prototype.setItem=window.originalSet; }")')
          ])
          patch('scripts/check-bundles.py','40020d1a975d0f1bcf6fd3b9af830ea9309c9e7d789f513992ed725470fba5dc','163df5b2e3d7b0df8f34989562afd169af5e0a0b2c0805fab0faecab1271becb',[
              (" name='skill-switchboard-'+edition\n"," name='skill-switchboard-'+edition\n shipped=root/edition/f'{name}.zip'\n if shipped.exists():\n  assert shipped.read_bytes()==(root/'dist'/f'{name}.zip').read_bytes(), 'Committed bundle is stale: run npm run package'\n")
          ])
          Path('scripts/package.mjs').write_text("""/** Refresh the small downloadable bundles committed beside each edition. */
          import {copyFile} from 'node:fs/promises';
          import {resolve,dirname} from 'node:path';
          import {fileURLToPath} from 'node:url';
          const root=resolve(dirname(fileURLToPath(import.meta.url)),'..');
          for(const edition of ['chatgpt','claude','gemini']){
           const file=`skill-switchboard-${edition}.zip`;
           await copyFile(resolve(root,'dist',file),resolve(root,edition,file));
           console.log(`Refreshed ${edition}/${file}`);
          }
          """)
          p=Path('package.json');s=p.read_text()
          if '"package":' not in s:
              s=s.replace('"build": "node scripts/build.mjs",','"build": "node scripts/build.mjs",\n    "package": "npm run build && node scripts/package.mjs",')
              p.write_text(s)
          for edition in ('chatgpt','claude','gemini'):
              p=Path(edition)/'README.md';s=p.read_text()
              if '## Try it without installing anything' in s: continue
              intro=f"""## Try it without installing anything

          [**Download the app + instruction bundle**](https://github.com/bohselecta/ai-skill-switchboard/raw/refs/heads/main/{edition}/skill-switchboard-{edition}.zip)

          Unzip the download and open `skill-switchboard-{edition}/references/companion.html`
          in your browser. The complete app and artwork are included. Start with the labeled
          sample board; no account connection or API setup is needed. Keep private backups,
          especially when using a downloaded file. The same ZIP can be used for the optional
          provider skill installation described below.

          """
              assert s.count('## Requirements\n')==1
              p.write_text(s.replace('## Requirements\n',intro+'## Requirements\n'))
          p=Path('README.md');s=p.read_text()
          if '## Try a ready-to-use bundle' not in s:
              intro="""## Try a ready-to-use bundle

          [**ChatGPT download**](https://github.com/bohselecta/ai-skill-switchboard/raw/refs/heads/main/chatgpt/skill-switchboard-chatgpt.zip) ·
          [**Claude download**](https://github.com/bohselecta/ai-skill-switchboard/raw/refs/heads/main/claude/skill-switchboard-claude.zip) ·
          [**Gemini download**](https://github.com/bohselecta/ai-skill-switchboard/raw/refs/heads/main/gemini/skill-switchboard-gemini.zip)

          Unzip your edition and open its `references/companion.html`. No terminal, account
          connection, or API key is needed. The ZIP includes the complete app, generated art,
          reusable skill instructions, and license. For more predictable persistence, use the
          local-server setup below. Export backups before closing or moving a file workspace.

          """
              assert s.count('## Get started\n')==1
              s=s.replace('## Get started\n',intro+'## Get started\n')
              s=s.replace('Keep contributions bounded, reversible,','After code or bundled-instruction changes, run `npm run package` and commit the\nthree refreshed edition ZIPs; CI rejects stale committed bundles.\n\nKeep contributions bounded, reversible,')
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser.py scripts/check-bundles.py scripts/package.mjs package.json README.md chatgpt/README.md claude/README.md gemini/README.md
          git diff --cached --quiet || git commit -m 'Complete browser fault injection and provide reproducible one-click edition downloads'
          git push origin HEAD:feat/three-edition-switchboard
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests, provider HTTP contracts and builds
        run: npm run check
      - name: Install browser tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Served browser acceptance
        run: |
          npm start > /tmp/switchboard-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Package and independently verify downloadable editions
        run: |
          npm run package
          python scripts/check-bundles.py
      - name: Commit actual screenshots, downloads and evidence only after all checks pass
        run: |
          python - <<'PY'
          import json, pathlib, shutil, os
          report=json.loads(pathlib.Path('artifacts/browser-report.json').read_text())
          assert len(report['results'])==22 and all(r['status']=='passed' for r in report['results'])
          for edition in ('chatgpt','claude','gemini'):
              shutil.copyfile(f'artifacts/{edition}-board.png',f'{edition}/assets/board.png')
          report['source_commit']=os.environ['SOURCE_COMMIT']
          report['workflow_run']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report['node_tests_passed']=45
          report['native_account_installation_tested']=False
          pathlib.Path('docs/verification.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git add chatgpt/assets/board.png claude/assets/board.png gemini/assets/board.png docs/verification.json chatgpt/skill-switchboard-chatgpt.zip claude/skill-switchboard-claude.zip gemini/skill-switchboard-gemini.zip
          git commit -m 'Publish verified three-edition downloads, actual screenshots and acceptance evidence'
          git push origin HEAD:feat/three-edition-switchboard
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switchboard-release-evidence
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: switchboard-release-apps-and-skills
          path: dist/
