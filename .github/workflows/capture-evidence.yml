name: Capture release evidence
on:
  push:
    branches: [feat/three-edition-switchboard]
    paths: [.github/workflows/capture-evidence.yml]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/three-edition-switchboard
      - name: Repair dialog lifecycle and exercise settled clipboard recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def patch(path, before, after, replacements):
              p = Path(path)
              current = hashlib.sha256(p.read_bytes()).hexdigest()
              if current == after: return
              assert current == before, 'Unexpected concurrent source change'
              source = p.read_text()
              for old, new in replacements:
                  assert source.count(old) == 1
                  source = source.replace(old, new)
              p.write_text(source)
              assert hashlib.sha256(p.read_bytes()).hexdigest() == after
          patch('shared/app.mjs', 'f359b72bad65ecaf5eb1bdc9efd56177d64a99d1b0e203f6963f5b79507572ca', 'd29574b2ecfca59b1b0f91bfe22aed269e74816c553c5bc230150ed9ffef8aa4', [
              ("const d=$('#dialog');if(d.open)d.close();delete d.dataset.taskId;", "const d=$('#dialog');delete d.dataset.taskId;"),
              ("d.showModal();d.scrollTop=0;}", "if(!d.open)d.showModal();d.scrollTop=0;d.querySelector('button,input,textarea,select,a[href]')?.focus();}"),
              ("$('#dialog').addEventListener('close',()=>{focused=null;});", "$('#dialog').addEventListener('close',()=>{if(!$('#dialog').open)focused=null;});")
          ])
          old = "                click(page,'copy-request')\n                # Either real clipboard or a visible manual fallback is acceptable."
          js = 'document.querySelector(\'[aria-label="Text to copy"]\') || document.querySelector("#toast").textContent.startsWith("Copied.")'
          new = "                click(page,'copy-request')\n                # Wait for clipboard settlement before using the dialog's return control.\n                page.wait_for_function(" + repr(js) + ")\n                # Either real clipboard or a visible manual fallback is acceptable."
          patch('tests/browser.py', '678eb2ae23b4c10036593f003dcedab94c02a63fc71014134ea2507dab1c73f9', '4ab8d59c74f34a22387e49c524ee4e9deb6838d5e31782445714d61d1b117e3a', [(old, new)])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/app.mjs tests/browser.py
          git diff --cached --quiet || git commit -m 'Preserve task context across dialog transitions and test asynchronous clipboard recovery'
          git push origin HEAD:feat/three-edition-switchboard
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests, provider HTTP contracts and builds
        run: npm run check
      - name: Install browser tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Served browser acceptance
        run: |
          npm start > /tmp/switchboard-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Verify bundles
        run: python scripts/check-bundles.py
      - name: Commit actual screenshots and acceptance evidence only after all checks pass
        run: |
          python - <<'PY'
          import json, pathlib, shutil, os
          report = json.loads(pathlib.Path('artifacts/browser-report.json').read_text())
          assert len(report['results']) == 22 and all(r['status'] == 'passed' for r in report['results'])
          for edition in ('chatgpt','claude','gemini'):
              shutil.copyfile(f'artifacts/{edition}-board.png', f'{edition}/assets/board.png')
          report['source_commit'] = os.environ['SOURCE_COMMIT']
          report['workflow_run'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report['node_tests_passed'] = 45
          report['native_account_installation_tested'] = False
          pathlib.Path('docs/verification.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          git add chatgpt/assets/board.png claude/assets/board.png gemini/assets/board.png docs/verification.json
          git commit -m 'Publish actual three-edition browser screenshots and passing acceptance evidence'
          git push origin HEAD:feat/three-edition-switchboard
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switchboard-release-evidence
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: switchboard-release-apps-and-skills
          path: dist/
